# Stages this n8n community node package on npm, with a provenance statement, on every version tag push.
#
# n8n accepts a verified community node only when it was published by GitHub Actions with npm provenance; provenance
# lets anyone check that a package was built by this workflow, from this repository and commit.
#
# ─── HOW IT REACHES NPM ────────────────────────────────────────────────────────
#
# npm Trusted Publishing (OIDC): the package's npm settings name this repository and `publish.yml`, so no token or
# secret is used. That trusted publisher allows `npm stage publish` only, so a run STAGES the version, and a maintainer
# makes it live on npmjs.com: the package → Staged Packages → Approve (with 2FA). The approved version keeps its
# provenance.
#
# ⚠ Not `npm run release`: in CI the node CLI's release runs `npm publish`, which a stage-only trusted publisher
# refuses ("403 … OIDC permission denied for this action").
#
# ─── RELEASING A VERSION ───────────────────────────────────────────────────────
#
# Set the version in package.json (and package-lock.json) and CHANGELOG.md, push to main, wait for CI, then push a tag
# named exactly the version (e.g. 0.2.0). This workflow lints, builds and stages it; then approve it on npmjs.com.

name: Publish

on:
  push:
    tags:
      # Matches 0.1.0, 1.2.3, 2.0.0-rc.1, etc.
      - '*.*.*'

jobs:
  publish:
    name: Stage on npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint the OIDC token npm's trusted publishing and the provenance statement use.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Stage the version
        # RELEASE_MODE lets the package's prepublishOnly guard (n8n-node prerelease) through, as the node CLI's own
        # release does.
        run: |
          npm run lint
          npm run build
          npm stage publish . --provenance --access public
        env:
          RELEASE_MODE: 'true'
